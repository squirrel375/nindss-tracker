name: Weekly NINDSS data update

on:
  schedule:
    # 04:00 UTC every Wednesday = 2:00pm AEST weekly
    - cron: "0 4 * * 3"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python nindss_tracker.py --data-dir data --graphs-dir graphs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data graphs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly data update: $(date -u +'%Y-%m-%d')"
            git push
          fi

      # The dashboard this reads from is an undocumented internal Power BI
      # API - if health.gov.au changes it, the run above will fail. Open an
      # issue automatically so it doesn't fail silently for weeks.
      - name: Open an issue if the run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly data fetch failed (${new Date().toISOString().slice(0, 10)})`,
              body:
                "The scheduled NINDSS data fetch failed.\n\n" +
                "This most likely means health.gov.au changed something in the " +
                "underlying Power BI dashboard (a new report ID, a changed disease " +
                "name, or a different response format).\n\n" +
                `See the failed run for details: ${runUrl}\n\n` +
                "See the CAVEATS section at the top of nindss_tracker.py for how to " +
                "re-capture a HAR file and fix it.",
              labels: ["bug"],
            });

